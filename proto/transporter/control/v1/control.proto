syntax = "proto3";

// Control plane protocol between agents and the coordinator.
package transporter.control.v1;

import "google/protobuf/timestamp.proto";

// ControlService is served by the coordinator and called by agents.
//
// Register is authenticated by a pre-auth key in the request. Every other RPC
// is authenticated with the node token returned by Register, sent as
// "Authorization: Bearer <token>".
service ControlService {
  // Register enrolls a node and returns its overlay address and node token.
  // Registering again with the same WireGuard key returns the existing node
  // with a fresh token.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // WatchNetmap streams the node's view of the mesh: one message right away,
  // then one whenever anything relevant to the node changes. While the stream
  // is open the node counts as online.
  rpc WatchNetmap(WatchNetmapRequest) returns (stream WatchNetmapResponse);
  // UpdateEndpoints replaces the node's advertised endpoints, e.g. after its
  // public address (learned via STUN) changed. Peers get a new netmap.
  rpc UpdateEndpoints(UpdateEndpointsRequest) returns (UpdateEndpointsResponse);
  // ReportStatus tells the coordinator how the node reaches each peer, for
  // the admin's topology view. Agents call it periodically.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
}

message RegisterRequest {
  string auth_key = 1;
  // Curve25519 WireGuard public key, 32 bytes.
  bytes wireguard_public_key = 2;
  string hostname = 3;
  // Operating system, e.g. "linux".
  string os = 4;
}

message RegisterResponse {
  Node node = 1;
  // Secret bearer token for subsequent RPCs. Store it securely.
  string node_token = 2;
}

message WatchNetmapRequest {
  // Endpoints (ip:port) where this node may be reachable directly.
  repeated string endpoints = 1;
  // Subnet routes (CIDR) this node offers to forward to; "0.0.0.0/0" offers
  // it as an exit node. Routes take effect once approved.
  repeated string advertised_routes = 2;
}

message WatchNetmapResponse {
  // The calling node.
  Node self = 1;
  // Every other node this node may talk to.
  repeated Node peers = 2;
  // Overlay network prefix in CIDR form, e.g. "100.64.0.0/10".
  string network_prefix = 3;
  // UDP port of the coordinator's STUN server on the coordinator's host;
  // 0 when STUN is disabled.
  uint32 stun_port = 4;
  // Whether the coordinator relays packets (at /relay/v1) between nodes
  // that cannot connect directly.
  bool relay_enabled = 5;
  // Inbound traffic this node accepts from the mesh, compiled from the
  // access-control policy. Packets matching no rule are dropped unless they
  // answer a connection this node opened. Empty means accept nothing.
  repeated FilterRule packet_filter = 6;
  DnsConfig dns = 7;
}

// FilterRule accepts packets from any source prefix to any destination,
// using one of the protocols.
message FilterRule {
  // Source prefixes in CIDR form.
  repeated string src_prefixes = 1;
  repeated FilterDestination destinations = 2;
  // IP protocol numbers (1 ICMP, 6 TCP, 17 UDP); empty means any.
  repeated uint32 protocols = 3;
}

message FilterDestination {
  // Destination prefix in CIDR form.
  string prefix = 1;
  // Inclusive port range; ignored for ICMP.
  uint32 first_port = 2;
  uint32 last_port = 3;
}

message DnsConfig {
  // Whether the agent answers <node>.<domain> at 100.100.100.100.
  bool magic_dns = 1;
  // Domain under which node names resolve, e.g. "mesh.internal".
  string domain = 2;
  // Domains resolved by specific (usually in-mesh) resolvers.
  repeated SplitDns split_dns = 3;
}

message SplitDns {
  string domain = 1;
  // Resolver addresses (ip or ip:port).
  repeated string resolvers = 2;
}

message ReportStatusRequest {
  repeated PeerPath peers = 1;
}

message PeerPath {
  string node_id = 1;
  // "direct" or "relay".
  string path = 2;
  // Round-trip time of the direct path; 0 when relayed or unknown.
  double latency_ms = 3;
}

message ReportStatusResponse {}

message UpdateEndpointsRequest {
  // Endpoints (ip:port) where this node may be reachable directly.
  repeated string endpoints = 1;
}

message UpdateEndpointsResponse {}

message Node {
  string id = 1;
  // Unique DNS-safe name in the mesh, derived from the hostname.
  string name = 2;
  string hostname = 3;
  string os = 4;
  bytes wireguard_public_key = 5;
  // Overlay addresses in CIDR form, e.g. "100.64.0.1/32".
  repeated string addresses = 6;
  // Candidate endpoints (ip:port), best first.
  repeated string endpoints = 7;
  bool online = 8;
  google.protobuf.Timestamp last_seen = 9;
  repeated string tags = 10;
  // Approved subnet routes the node forwards to (CIDR); "0.0.0.0/0" means
  // it is an exit node.
  repeated string routes = 11;
}
