version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sneakybugmaster/transporter/internal/proto
# Plugins are pinned as Go tools in go.mod, so generation needs no network
# access beyond the Go module proxy. Run `make generate`.
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/proto
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: internal/proto
    opt: paths=source_relative
