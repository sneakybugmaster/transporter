name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 3

  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - run: go test -race ./...

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false
          push: false

  native:
    name: Native build (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: make build
      - name: Smoke test
        run: |
          ext=$(go env GOEXE)
          ./bin/transporter$ext version
          ./bin/transporter-coordinator$ext -version
          ./bin/transporter-coordinator$ext -listen 127.0.0.1:18080 -data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 1 30); do
            ./bin/transporter-coordinator$ext -listen 127.0.0.1:18080 -healthcheck && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'
          kill %1

  cross:
    name: Cross-compile
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: make cross

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch coordinator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/coordinator.Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator
      - name: Build multi-arch agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Load coordinator image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/coordinator.Dockerfile
          load: true
          tags: transporter-coordinator:ci
          cache-from: type=gha,scope=coordinator
      - name: Smoke test
        run: |
          docker run -d --name coordinator -p 8080:8080 transporter-coordinator:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/version
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker rm -f coordinator

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
