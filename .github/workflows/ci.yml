name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated API types are up to date
        working-directory: web
        run: |
          pnpm generate
          git diff --exit-code -- src/lib/api.gen.ts
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 3

  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: go test -race ./...

  proto:
    name: Protobuf lint & Go codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf format -d --exit-code
      - name: Generated code is up to date
        run: |
          buf generate
          (cd api && go tool oapi-codegen -config oapi-codegen.yaml openapi.yaml)
          git diff --exit-code -- internal/proto internal/coordinator/adminapi

  native:
    name: Native build, tests & smoke (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: make build
      - run: ./bin/transporter version && ./bin/transporter-coordinator -version
      - name: Unit tests
        run: go test ./...
      - name: Fetch Wintun
        if: runner.os == 'Windows'
        run: |
          scripts/fetch-wintun.sh build/wintun
          cp build/wintun/amd64/wintun.dll bin/
      - name: Smoke test (userspace + TUN agents, service install)
        env:
          SMOKE_TUN: "1"
          SMOKE_SERVICE: "1"
          SUDO: ${{ runner.os != 'Windows' && 'sudo' || '' }}
        run: test/smoke/run.sh

  cross:
    name: Cross-compile
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: make cross

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch coordinator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/coordinator.Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator
      - name: Build multi-arch agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Load coordinator image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/coordinator.Dockerfile
          load: true
          tags: transporter-coordinator:ci
          cache-from: type=gha,scope=coordinator
      - name: Smoke test
        run: |
          docker run -d --name coordinator -p 8080:8080 transporter-coordinator:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/version
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker rm -f coordinator

  integration:
    name: Mesh integration and NAT traversal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Three nodes on one network
        run: test/integration/run.sh
      - name: NAT lab (cone and symmetric NATs)
        run: test/integration/nat/run.sh

  e2e:
    name: E2E (setup wizard + enrollment in the browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Build images
        run: docker compose -f test/integration/docker-compose.yml build
      - run: test/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: web/e2e-results
          retention-days: 7

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
