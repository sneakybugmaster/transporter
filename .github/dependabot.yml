# Weekly dependency updates. Security updates are raised as soon as an
# advisory is published, independent of this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/deploy/docker, /test/integration/routing]
    schedule: {interval: weekly}
