openapi: 3.0.3
info:
  title: Transporter admin API
  version: "1"
  description: |
    Administration API of the Transporter coordinator, used by the web UI.
    Authenticated with a session cookie (`tp_session`) obtained from
    `POST /auth/login`, single sign-on or `POST /setup`, or with an API token
    (`Authorization: Bearer tpa_...`) for scripts. Requests that change state
    must send `Content-Type: application/json`. API tokens cannot manage API
    tokens or change passwords.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - tokenAuth: []

paths:
  /version:
    get:
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}

  /setup:
    get:
      operationId: getSetup
      security: []
      responses:
        "200":
          description: Whether first-run setup is still needed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupStatus"}
    post:
      operationId: completeSetup
      security: []
      description: |
        Creates the first admin. Requires the one-time setup code the
        coordinator prints in its log at startup. Starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupRequest"}
      responses:
        "200":
          description: Setup completed; session cookie set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}

  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Logged in; session cookie set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /auth/methods:
    get:
      operationId: getAuthMethods
      security: []
      responses:
        "200":
          description: How admins can sign in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthMethods"}

  /auth/oidc/login:
    get:
      operationId: oidcLogin
      security: []
      description: Starts single sign-on; redirects to the identity provider.
      responses:
        "302": {description: Redirect to the identity provider.}
        "404": {$ref: "#/components/responses/Error"}

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      security: []
      description: |
        Where the identity provider sends the browser back. Starts a session
        and redirects to the console, or to the login page with an error.
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302": {description: Redirect to the console or the login page.}

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": {description: Logged out.}

  /auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The logged-in admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Error"}

  /auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChange"}
      responses:
        "204": {description: Password changed; other sessions ended.}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

  /stats:
    get:
      operationId: getStats
      responses:
        "200":
          description: Mesh summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Stats"}

  /nodes:
    get:
      operationId: listNodes
      responses:
        "200":
          description: All nodes, ordered by address.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Node"}

  /nodes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getNode
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateNode
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NodeUpdate"}
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteNode
      responses:
        "204": {description: Deleted; the node is disconnected.}
        "404": {$ref: "#/components/responses/Error"}

  /authkeys:
    get:
      operationId: listAuthKeys
      responses:
        "200":
          description: All auth keys, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuthKey"}
    post:
      operationId: createAuthKey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthKeyCreate"}
      responses:
        "201":
          description: Created. The secret is only ever returned here.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthKeyCreated"}
        "400": {$ref: "#/components/responses/Error"}

  /authkeys/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: revokeAuthKey
      responses:
        "204": {description: Revoked. Nodes it enrolled are unaffected.}
        "404": {$ref: "#/components/responses/Error"}

  /tokens:
    get:
      operationId: listAPITokens
      responses:
        "200":
          description: API tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/APIToken"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAPIToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/APITokenCreate"}
      responses:
        "201":
          description: Created. The secret is only ever returned here.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APITokenCreated"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

  /tokens/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: deleteAPIToken
      responses:
        "204": {description: Revoked.}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}

  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Coordinator settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsUpdate"}
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/Error"}

  /policy:
    get:
      operationId: getPolicy
      responses:
        "200":
          description: The access-control policy (HuJSON source).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
    put:
      operationId: setPolicy
      description: |
        Replaces the policy. It must parse, and its `tests` must pass against
        the current nodes; otherwise nothing changes and `details` lists the
        problems.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Policy"}
      responses:
        "200":
          description: Saved and pushed to every node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
        "400":
          description: Invalid policy or failed tests.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyError"}

  /policy/check:
    post:
      operationId: checkPolicy
      description: |
        Simulates one connection against the saved policy, or against a
        draft when `policy` is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyCheck"}
      responses:
        "200":
          description: Verdict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyCheckResult"}
        "400":
          description: Invalid draft policy or endpoints.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyError"}

  /dns:
    get:
      operationId: getDNS
      responses:
        "200":
          description: DNS settings pushed to nodes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSConfig"}
    put:
      operationId: setDNS
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DNSConfig"}
      responses:
        "200":
          description: Saved and pushed to every node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DNSConfig"}
        "400": {$ref: "#/components/responses/Error"}

  /topology:
    get:
      operationId: getTopology
      responses:
        "200":
          description: How online nodes reach each other, as they last reported.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Topology"}

  /audit:
    get:
      operationId: listAudit
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: before, in: query, description: Only entries with a smaller id (paging)., schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Administrative changes, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}

  /events:
    get:
      operationId: streamEvents
      description: |
        Server-Sent Events. Emits a `change` event whenever nodes join,
        leave, connect, disconnect or are edited; clients refetch.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: {type: string}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tp_session
    tokenAuth:
      type: http
      scheme: bearer

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}

    Version:
      type: object
      required: [version, commit, date, goVersion, platform]
      properties:
        version: {type: string}
        commit: {type: string}
        date: {type: string}
        goVersion: {type: string}
        platform: {type: string}

    SetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup: {type: boolean}

    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode: {type: string}
        username: {type: string}
        password: {type: string}
        publicURL:
          type: string
          description: URL nodes use to reach the coordinator, e.g. https://mesh.example.com

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}

    Me:
      type: object
      required: [username, hasPassword]
      properties:
        username: {type: string}
        hasPassword: {type: boolean, description: False for admins who only sign in through SSO.}

    AuthMethods:
      type: object
      required: [password, oidc]
      properties:
        password: {type: boolean}
        oidc: {type: boolean}
        oidcName: {type: string, description: Label for the single sign-on button.}

    APIToken:
      type: object
      required: [id, description, admin, createdAt]
      properties:
        id: {type: string}
        description: {type: string}
        admin: {type: string, description: The admin the token acts as.}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}
        lastUsed: {type: string, format: date-time, nullable: true}

    APITokenCreate:
      type: object
      required: [ttlSeconds]
      properties:
        description: {type: string}
        ttlSeconds: {type: integer, minimum: 0, description: Lifetime in seconds; 0 never expires.}

    APITokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: "#/components/schemas/APIToken"}
        secret: {type: string}

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string}
        newPassword: {type: string}

    Stats:
      type: object
      required: [nodes, online]
      properties:
        nodes: {type: integer}
        online: {type: integer}

    Node:
      type: object
      required: [id, name, hostname, os, addresses, endpoints, online, lastSeen, createdAt, publicKey,
                 tags, advertisedRoutes, approvedRoutes, routes, keyExpiryDisabled]
      properties:
        tags: {type: array, items: {type: string}}
        advertisedRoutes:
          type: array
          items: {type: string}
          description: Subnets the node offers to forward to; 0.0.0.0/0 offers an exit node.
        approvedRoutes:
          type: array
          items: {type: string}
          description: Routes an admin or the policy's autoApprovers allowed.
        routes:
          type: array
          items: {type: string}
          description: Routes in effect (advertised and approved).
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the node must re-authenticate; null means never.
        keyExpiryDisabled: {type: boolean}
        id: {type: string}
        name: {type: string}
        hostname: {type: string}
        os: {type: string}
        publicKey: {type: string, description: WireGuard public key (base64).}
        addresses: {type: array, items: {type: string}}
        endpoints: {type: array, items: {type: string}}
        online: {type: boolean}
        lastSeen: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}

    NodeUpdate:
      type: object
      description: Fields to change; omitted fields stay as they are.
      properties:
        name: {type: string}
        tags:
          type: array
          items: {type: string}
          description: Replaces the node's tags, e.g. ["tag:server"].
        approvedRoutes:
          type: array
          items: {type: string}
          description: Replaces the routes the node may use (CIDR).
        keyExpiryDisabled:
          type: boolean
          description: Exempt the node from key expiry, or subject it again (expiry restarts now).
        expireNow:
          type: boolean
          description: Expire the node's key immediately; it must re-authenticate.

    AuthKey:
      type: object
      required: [id, description, reusable, usedCount, revoked, valid, createdAt, tags]
      properties:
        tags:
          type: array
          items: {type: string}
          description: Given to nodes the key enrolls.
        id: {type: string}
        description: {type: string}
        reusable: {type: boolean}
        usedCount: {type: integer}
        revoked: {type: boolean}
        valid: {type: boolean, description: Whether it can still enroll a node.}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}

    AuthKeyCreate:
      type: object
      required: [reusable, ttlSeconds]
      properties:
        description: {type: string}
        reusable: {type: boolean}
        ttlSeconds:
          type: integer
          minimum: 0
          description: Lifetime in seconds; 0 means the key never expires.
        tags:
          type: array
          items: {type: string}

    AuthKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key: {$ref: "#/components/schemas/AuthKey"}
        secret: {type: string}

    Settings:
      type: object
      required: [publicURL, networkPrefix, stunPort, relayEnabled, version, keyExpiryDays]
      properties:
        publicURL: {type: string}
        keyExpiryDays: {type: integer, description: Days a node key lasts before it must re-authenticate; 0 is forever.}
        networkPrefix: {type: string}
        stunPort: {type: integer}
        relayEnabled: {type: boolean}
        version: {type: string}

    SettingsUpdate:
      type: object
      properties:
        publicURL: {type: string}
        keyExpiryDays: {type: integer, minimum: 0, maximum: 3650}

    Policy:
      type: object
      required: [policy]
      properties:
        policy: {type: string, description: HuJSON policy document.}

    PolicyError:
      type: object
      required: [error, details]
      properties:
        error: {type: string}
        details: {type: array, items: {type: string}}

    PolicyCheck:
      type: object
      required: [src, dst, port]
      properties:
        policy: {type: string, description: Draft policy to check instead of the saved one.}
        src: {type: string, description: Node name or IPv4 address.}
        dst: {type: string, description: Node name or IPv4 address (may be inside a route).}
        port: {type: integer, minimum: 0, maximum: 65535}
        proto: {type: string, enum: [tcp, udp, icmp], default: tcp}

    PolicyCheckResult:
      type: object
      required: [allowed, srcAddr, dstAddr, reason]
      properties:
        allowed: {type: boolean}
        rule: {type: integer, nullable: true, description: Index of the matching ACL.}
        srcAddr: {type: string}
        dstAddr: {type: string}
        reason: {type: string}

    DNSConfig:
      type: object
      required: [magicDNS, domain, split]
      properties:
        magicDNS:
          type: boolean
          description: Nodes answer <node>.<domain> at 100.100.100.100.
        domain: {type: string, example: mesh.internal}
        split:
          type: array
          items: {$ref: "#/components/schemas/SplitDNS"}

    SplitDNS:
      type: object
      required: [domain, resolvers]
      properties:
        domain: {type: string, example: corp.example.com}
        resolvers: {type: array, items: {type: string}, example: ["10.0.0.53"]}

    Topology:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items: {$ref: "#/components/schemas/TopologyLink"}

    TopologyLink:
      type: object
      required: [from, to, path]
      properties:
        from: {type: string, description: Reporting node ID.}
        to: {type: string, description: Peer node ID.}
        path: {type: string, enum: [direct, relay]}
        latencyMs: {type: number, format: double}

    AuditEntry:
      type: object
      required: [id, time, actor, action, target, detail]
      properties:
        id: {type: integer, format: int64}
        time: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        target: {type: string}
        detail: {type: string}
